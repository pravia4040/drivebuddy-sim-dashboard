<script>
// Minimal stand-ins for the dashboard globals the provider modules call
const TIERS=[2,5,10,20,85,100,175,200];
const PLAN_PRICES={2:100,10:149,20:199,85:375,100:499,175:850,200:999};
function extractGB(p){const m=(p||'').match(/(\d+)GB/);return m?parseInt(m[1]):0;}
function extractPrice(p){const m=(p||'').match(/INR\s*(\d+)\s*PM/i);return m?parseInt(m[1]):PLAN_PRICES[extractGB(p)]||null;}
function getFlag(p){if(p>=100)return'EXCEEDED';if(p>=90)return'CRITICAL';if(p>=75)return'WARNING';if(p>=50)return'MODERATE';if(p>0)return'OK';return'NO DATA';}
function buildStats(v){return{total:v.length,with_plan:v.filter(x=>x.plan).length,no_usage:v.filter(x=>x.sim_no&&!x.plan).length,no_sim:v.filter(x=>!x.sim_no).length,at_100:v.filter(x=>x.usage_pct>=100).length,critical:v.filter(x=>x.usage_pct>=90&&x.usage_pct<100).length,warning:v.filter(x=>x.usage_pct>=75&&x.usage_pct<90).length};}
function isNoUsage(v){const s=(v.sim_no||'').trim();return s!==''&&s!=='nan'&&!v.plan;}
let VIEWS=[];function applyProviderView(v){VIEWS.push(v);}
</script>

<script>
(async function(){
const LOG=document.getElementById('log');let pass=0,fail=0;
const ok=(c,m)=>{c?pass++:fail++;LOG.innerHTML+=`<span class="${c?'p':'f'}">${c?'PASS':'FAIL'}</span> ${m}\n`;};
const eq=(a,b,m)=>ok(JSON.stringify(a)===JSON.stringify(b),`${m} (got ${JSON.stringify(a)}, want ${JSON.stringify(b)})`);
const near=(a,b,m,t=1e-6)=>ok(Math.abs(a-b)<=t,`${m} (got ${a}, want ${b})`);
const group=t=>LOG.innerHTML+=`<div class="g">— ${t}</div>`;
const V=ViProvider;
const TODAY='2026-10-06';                       // Sep 2026 closed, Oct 2026 open
const bd=a=>V.buildDataset(Object.assign({today:TODAY},a));

// ── synthetic VI exports (same columns as the real Self-Care files) ──
const E='S-TEST0001-0C0000-TEST CUSTOMER';
const SUMH='E_CODE,ACCOUNT_ID,MSISDN,IMSI,ICCID,CIRCLE,TOTAL_USAGE:Data-kiloBytes/Voice-Seconds/SMS-Count,ORIGIN_CIRCLE,Last_Packet_Switched_Session_End,Packet_Switched_Session_Days';
const sum=rows=>[SUMH,...rows].join('\n');
const S1=sum([
  `${E},1,915700000000001,404000000000001,~8991000000000000001,1130499,1048576.0000,GUJ_HOME,2026-09-20 10:00:00,20`,  // 1 GB
  `${E},1,915700000000002,404000000000002,~8991000000000000002,1130499,524288.0000,GUJ_HOME,2026-09-10 10:00:00,5`,   // 0.5 GB, circle A
  `${E},1,915700000000002,404000000000002,~8991000000000000002,1130569,524288.0000,MAH_GUJ,2026-09-21 23:00:00,3`,    // 0.5 GB, circle B
  `${E},1,915700000000003,404000000000003,~8991000000000000003,1130499,90177536.0000,NULL,2026-09-21 12:00:00,30`,     // 86 GB (over an 85 GB share)
  `${E},1,915700000000001,404000000000001,~8991000000000000001,1130499,1048576.0000,GUJ_HOME,2026-09-20 10:00:00,20`,  // exact repeat → duplicate
  `${E},1,915700000000009,404000000000009,~12345,1130499,1024,NULL,2026-09-01 00:00:00,1`,                              // invalid ICCID
  `${E},1,915700000000008,404000000000008,~8991000000000000008,1130499,NULL,NULL,2026-09-01 00:00:00,1`,               // missing usage
]);
// itemized: same rows + 3 day columns (bytes) + totals
const ITH='E_CODE,ACCOUNTID,MSISDN,IMSI,ICCID,CIRCLE,2026-08-22,2026-08-23,2026-09-21,TOTAL_USAGE:Data-KiloBytes/Voice-Seconds/SMS-Count,ORIGIN_CIRCLE,Last_Packet_Switched_Session_End,Packet_Switched_Session_Days';
const it=rows=>[ITH,...rows].join('\n');
const B=gb=>Math.round(gb*1024*1024*1024);
const I1=it([
  `${E},1,915700000000001,404000000000001,~8991000000000000001,1130499,${B(0.5)},NULL,${B(0.5)},1048576.0000,GUJ_HOME,2026-09-20 10:00:00,2`,
  `${E},1,915700000000002,404000000000002,~8991000000000000002,1130499,${B(0.5)},NULL,NULL,524288.0000,GUJ_HOME,2026-09-10 10:00:00,1`,
  `${E},1,915700000000002,404000000000002,~8991000000000000002,1130569,${B(0.25)},NULL,${B(0.25)},524288.0000,MAH_GUJ,2026-09-21 23:00:00,2`,
  `${E},1,915700000000003,404000000000003,~8991000000000000003,1130499,${B(40)},${B(40)},${B(6)},90177536.0000,NULL,2026-09-21 12:00:00,3`,
]);
const GH='E_CODE,ACCOUNT_ID,SUB_PROFILE_ID,SUB_PROFILE_NAME,PRODUCT_TYPE,MSISDN,IMSI,ICCID,CIRCLE,DATE_OF_ACTIVATION,SIM_LIFECYCLE_STATE,DEAL_NAME,BASE_PLAN_NAME,GROUP_NAME,CONTRACT_START_DATE,CONTRACT_END_DATE,CONTRACT_NAME';
const inv=rows=>[GH,...rows].join('\n');
const DP='CMP_VI_IOT_TEST_DP_100SMS_85GB_375R_GUJ', DPB='CMP_VI_IOT_TEST_DP_100SMS_85GB_375R', RD='CMP_Vi_IOT_READY_0_TEST_GUJ', P100='IOT_TEST0001_IOT_100GB_499_X_M2MISAFE_X';
const G1=inv([
  `${E},1,2,TEST,M2M,915700000000001,404000000000001,~8991000000000000001,Gujarat,2026-08-01 10:00:00.000000,active,${DP},${DPB},,,,NULL`,
  `${E},1,2,TEST,M2M,915700000000002,404000000000002,~8991000000000000002,Gujarat,2026-08-01 10:00:00.000000,active,${DP},${DPB},,,,NULL`,
  `${E},1,2,TEST,M2M,915700000000003,404000000000003,~8991000000000000003,Gujarat,2026-08-01 10:00:00.000000,active,${DP},${DPB},,,,NULL`,
  `${E},1,2,TEST,M2M,915700000000004,404000000000004,~8991000000000000004,Gujarat,2026-09-15 10:00:00.000000,active,${DP},${DPB},,,,NULL`,   // idle, recent
  `${E},1,2,TEST,M2M,915700000000005,404000000000005,~8991000000000000005,Gujarat,2026-09-01 10:00:00.000000,Ready,${RD},CMP_Vi_IOT_READY_0,,,,NULL`,
  `${E},1,2,TEST,M2M,915700000000006,404000000000006,~8991000000000000006,Gujarat,2025-09-01 10:00:00.000000,Dunning,${P100},CMP_Vi_IOT_100GB_499,,,,NULL`,
  `${E},1,2,TEST,M2M,915700000000007,404000000000007,~8991000000000000007,Gujarat,2025-09-01 10:00:00.000000,suspend,${P100},CMP_Vi_IOT_100GB_499,,,,NULL`,
  `${E},1,2,TEST,M2M,915700000000007,404000000000007,~8991000000000000007,Gujarat,2025-09-01 10:00:00.000000,suspend,${P100},CMP_Vi_IOT_100GB_499,,,,NULL`, // repeat
]);

group('file detection (by columns, not name)');
eq(V.detect(SUMH.split(',')),'vi_usage_summary','summary detected');
eq(V.detect(ITH.split(',')),'vi_usage_itemized','itemized detected');
eq(V.detect(GH.split(',')),'vi_sim_inventory','SIM group detected');
eq(V.detect(['SIM_NO','PLAN','USED DATA']),null,'Airtel file is not taken as VI');
const misnamed=V.parseFile(S1,'SELFCARE_USAGE_ITEMIZED_x.csv');
ok(misnamed.type==='vi_usage_summary'&&/columns are a Data Usage Summary/.test(misnamed.warnings[0].reason),'a misnamed file is typed by its columns and warned');

group('usage summary');
const s=V.parseFile(S1,'SELFCARE_USAGE_SUMMARY_20260925154743.csv');
eq([s.stats.total,s.stats.valid,s.stats.duplicates,s.stats.invalid,s.stats.unique_sims],[7,4,1,2,3],'rows / valid / duplicate / invalid / SIMs');
near(s.stats.total_mb,1024+512+512+88064,'KB → MB (1 KB = 1024 B)',1e-6);
eq(s.unit,'KB','unit read from the header');
eq(s.rows[0].iccid,'8991000000000000001','"~" text prefix stripped from ICCID');
eq(s.errors.map(e=>e.reason),['Invalid or missing ICCID','Missing usage value'],'invalid rows reported with reasons');
eq(s.suggestedMonth,'Sep 2026','month suggested from the last session date');
eq(s.exportedAt,'2026-09-25 15:47:43','export time read from the VI file name');

group('itemized (daily)');
const d=V.parseFile(I1,'SELFCARE_USAGE_ITEMIZED.csv');
eq([d.stats.valid,d.stats.unique_sims,d.stats.period_start,d.stats.period_end],[4,3,'2026-08-22','2026-09-21'],'rows, SIMs and billing cycle');
eq(d.unit,'bytes per day','daily unit confirmed as bytes against TOTAL_USAGE');
near(d.rows[3].daily_sum_mb,86*1024,'daily bytes → MB',0.01);
eq(d.suggestedMonth,'Sep 2026','cycle 22 Aug – 21 Sep labelled Sep 2026');
eq(V.monthLabelForDate('2026-08-21'),'Aug 2026','cycle ending 21 Aug → Aug 2026');

group('billing cycle 22nd → 21st (usage resets on the 22nd)');
eq(V.cycleForDate('2026-09-21'),{label:'Sep 2026',start:'2026-08-22',end:'2026-09-21',days:31,resets:'2026-09-22'},'21 Sep is the last day of the Sep 2026 cycle; it resets on 22 Sep');
eq([V.cycleForDate('2026-09-22').label,V.cycleForDate('2026-09-22').start,V.cycleForDate('2026-09-22').end],['Oct 2026','2026-09-22','2026-10-21'],'22 Sep starts the Oct 2026 cycle');
eq([V.cycleForDate('2026-12-25').label,V.cycleForDate('2026-12-25').end],['Jan 2027','2027-01-21'],'late December belongs to next year\'s January cycle');
eq([V.cycleForDate('2026-01-05').start,V.cycleForLabel('Mar 2026').days],['2025-12-22',28],'early January: cycle started 22 Dec; the Mar cycle (22 Feb – 21 Mar) has 28 days');
eq(V.monthLabelForDate('2026-09-23'),'Oct 2026','a date after the 22nd belongs to the next month\'s cycle');
const S2=sum([
  `${E},1,915700000000001,404000000000001,~8991000000000000001,1130499,1024,GUJ_HOME,2026-09-21 22:00:00,20`,
  `${E},1,915700000000002,404000000000002,~8991000000000000002,1130499,1024,GUJ_HOME,2026-09-20 10:00:00,5`,
  `${E},1,915700000000003,404000000000003,~8991000000000000003,1130499,1024,GUJ_HOME,2026-09-22 00:10:00,5`]);
eq(V.parseFile(S2,'s.csv').suggestedMonth,'Sep 2026','Summary cycle = where most last sessions fall (one ending 22 Sep 00:10 does not move it)');
const ITH2='E_CODE,ACCOUNTID,MSISDN,IMSI,ICCID,CIRCLE,2026-09-20,2026-09-21,2026-09-22,TOTAL_USAGE:Data-KiloBytes/Voice-Seconds/SMS-Count,ORIGIN_CIRCLE,Last_Packet_Switched_Session_End,Packet_Switched_Session_Days';
const I2=[ITH2,`${E},1,915700000000001,404000000000001,~8991000000000000001,1130499,${B(1)},${B(2)},${B(4)},7340032,GUJ_HOME,2026-09-22 10:00:00,3`].join('\n');
const d2=V.parseFile(I2,'x.csv');
eq([d2.suggestedMonth,d2.stats.cycles.length,/2 billing cycles/.test(d2.warnings[0].reason)],['Sep 2026',2,true],'an Itemized file crossing the 22nd is flagged; its main cycle is used');
const m4=V.mergeMonth(null,{itemized:d2},'Sep 2026');
near([...V.simTotals(m4,'itemized').values()].reduce((a,x)=>a+x.used_mb,0),3*1024,'only the Sep-cycle days count (20–21 Sep = 3 GB); 22 Sep belongs to the next cycle',1e-6);
eq([m4.period_start,m4.period_end,m4.last_data_date,m4.sources.itemized.dropped_days],['2026-08-22','2026-09-21','2026-09-21',1],'cycle bounds come from the label, not the file; the 22 Sep column is dropped');

group('"Data up to" day of an Itemized upload (like Airtel\'s snapshot date)');
const mU=V.mergeMonth(null,{itemized:d},'Sep 2026',null,{until:'2026-08-23'});
near([...V.simTotals(mU,'itemized').values()].reduce((a,x)=>a+x.used_mb,0)/1024,81.25,'data up to 23 Aug: only 22–23 Aug count (0.5 + 0.75 + 80 GB)',1e-6);
eq([mU.itemized_last,mU.itemized_until,Object.keys(mU.dailyTotals).sort()],['2026-08-23','2026-08-23',['2026-08-22','2026-08-23']],'later days are left out of the daily data too');
const mU2=V.mergeMonth(mU,{summary:s},'Sep 2026');
eq([mU2.itemized_until,V.itemizedLast(mU2)],['2026-08-23','2026-08-23'],'a later Summary upload keeps the Itemized report\'s date');

group('SIM inventory + plans');
const g=V.parseFile(G1,'SIMGROUP.csv');
eq([g.stats.valid,g.stats.duplicates],[7,1],'inventory rows / repeats');
eq(g.stats.states,{active:4,Ready:1,Dunning:1,suspend:1},'states kept exactly as VI writes them (active, Ready, Dunning, suspend)');
eq([g.rows[0].lifecycle_state,g.rows[0].status],['active','Active'],'raw state kept; a normalised status beside it (never overwriting it)');
eq((({plan_gb,price,pooled,ready})=>({plan_gb,price,pooled,ready}))(V.planInfo(DP)),{plan_gb:85,price:375,pooled:true,ready:false},'DP deal = 85 GB · ₹375 · pooled');
eq((({plan_gb,price,pooled})=>({plan_gb,price,pooled}))(V.planInfo(P100)),{plan_gb:100,price:499,pooled:false},'100 GB deal (no _DP_) = ₹499, its own plan — not in the data pool');
eq(V.planInfo('').pooled,false,'unknown plan (no allowance) is not counted in the pool');
eq((({plan_gb,price,ready})=>({plan_gb,price,ready}))(V.planInfo(RD)),{plan_gb:0,price:0,ready:true},'READY deal = inventory, 0 GB, ₹0');

group('merge + reconciliation (never double counted)');
let m=V.mergeMonth(null,{summary:s,itemized:d},'Sep 2026');
eq(m.recon.status,'matched','summary + itemized of the same cycle reconcile');
const tot=mm=>[...V.simTotals(mm).values()].reduce((a,x)=>a+x.used_mb,0);
near(tot(m),s.stats.total_mb,'month total = summary total (not summary + itemized)',1e-6);
eq(V.simTotals(m).get('8991000000000000002').session_days,2,'session days counted once across circles (1 + 2 days, one shared → 2, not 3)');
const m2=V.mergeMonth(m,{summary:s},'Sep 2026');
near(tot(m2),tot(m),'re-uploading the summary replaces it — total unchanged',1e-6);
const S1b=S1.replace('1048576.0000,GUJ_HOME,2026-09-20 10:00:00,20','2097152.0000,GUJ_HOME,2026-09-20 10:00:00,20');   // SIM 1 now 2 GB
const m3=V.mergeMonth(m,{summary:V.parseFile(S1b,'s.csv')},'Sep 2026');
near(tot(m3)-tot(m),1024,'corrected summary changes only the corrected SIM (+1 GB)',1e-6);
eq([m3.recon.status,m3.recon.mismatches.length,m3.recon.mismatches[0].iccid],['difference',1,'8991000000000000001'],'difference found and pinned to the row');
const mi=V.mergeMonth(null,{itemized:d},'Sep 2026');
eq(mi.recon.status,'itemized_only','itemized alone → totals from itemized, flagged');
const ms=V.mergeMonth(mi,{summary:s},'Sep 2026');
eq([ms.recon.status,!!ms.daily],['matched',true],'summary added later keeps the daily data and reconciles');

group('dataset for the dashboard');
const fleet=[{reg:'GJ01AA0001',client:'Alpha',hw_id:'HW1',sim:'8991000000000000001'},{reg:'GJ01AA0002',client:'Beta',hw_id:'HW2',sim:'915700000000002'},
  {reg:'GJ01AA0005',client:'Alpha',hw_id:'HW5',sim:'8991000000000000005'},{reg:'GJ01AA0099',client:'Gamma',hw_id:'HW9',sim:'8991982200000000099'}];
const inventory={as_of:'2026-09-25 15:48:40',sims:g.rows};
const ds=bd({inventory,months:{'Sep 2026':m},fleet});
eq(ds.CD.vehicles.filter(v=>!v.unmapped).map(v=>v.reg).sort(),['GJ01AA0001','GJ01AA0002','GJ01AA0005'],'vehicles matched by ICCID and by MSISDN; non-VI SIM ignored');
eq(ds.CD.vehicles.filter(v=>v.unmapped).map(v=>[v.reg,v.client,v.sim_no,v.plan_gb]),[['No vehicle · 915700000000003','No vehicle mapped','8991000000000000003',85],['No vehicle · 915700000000004','No vehicle mapped','8991000000000000004',85]],'SIMs with no vehicle in the vehicle master are still listed ("No vehicle · <mobile no.>") when they count or used data');
ok(!ds.CD.vehicles.some(v=>/915700000000006|915700000000007/.test(v.reg)),'…a SIM that neither counts nor used data and has no vehicle (Dunning, suspend) is not listed');
const v1=ds.CD.vehicles.find(v=>v.reg==='GJ01AA0001'), v5=ds.CD.vehicles.find(v=>v.reg==='GJ01AA0005');
eq([v1.plan_gb,v1.used_gb,v1.usage_pct,v1.flag,v1.sim_status,v1.sim_state,v1.pooled,v1.in_pool],[85,1,1.2,'OK','Active','active',true,true],'vehicle row: plan, usage %, flag, normalised + raw status, in the pool');
eq([v5.plan,v5.sim_status],['','Ready'],'Ready SIM shows as "without usage", not as a plan');
eq(ds.rtRows.length,7,'SIM list = every inventory SIM');
const r3=ds.rtRows.find(r=>r.sim_no==='8991000000000000003'), r5=ds.rtRows.find(r=>r.sim_no==='8991000000000000005'), r6=ds.rtRows.find(r=>r.sim_no==='8991000000000000006'), r7=ds.rtRows.find(r=>r.sim_no==='8991000000000000007');
near(r3.avail_mb,85*1024-86*1024,'pooled SIM over its share: negative available = drawn from the pool',1e-6);
eq([r5.alloc_mb,r6.alloc_mb,r7.alloc_mb],[0,0,0],'allocation only for SIMs that count: "active" on a data-pool deal (not Ready, Dunning or suspend)');
eq([r6.sim_state,r7.sim_state,r6.in_pool],['Dunning','suspend',false],'real-time rows show the raw state');
const P=ds.pool;
const PR4=85/30*7;   // SIM 4 activated 15 Sep: 15–21 Sep = 7 days × 85/30 GB
eq([P.pooled_sims,P.idle.count,P.idle.recent,P.over_share.count],[4,1,1,1],'pool: 4 active SIMs; 1 idle (started recently), 1 over its share');
near(P.capacity_gb,3*85+PR4,'total pool: 3 × 85 GB full cycle + SIM 4 pro-rated 7 × 2.83 = 19.83 GB',1e-9);
near(P.full_gb+P.prorated_gb,P.capacity_gb,'full allocation + pro-rated allocation = total pool',1e-9);
eq([P.new_activations.count,Math.round(P.new_activations.gb*100)/100],[1,19.83],'new activations this cycle: 1 SIM, 19.83 GB');
eq(P.plan_mix,[{gb:85,sims:3}],'full-cycle SIMs by plan size');
eq([P.prorated.sims,P.prorated.groups[0].from,P.prorated.groups[0].days,P.prorated.divisor_days],[1,'2026-09-15',7,30],'pro-rated group: 1 SIM from 15 Sep, 7 days, plan ÷ 30');
near(P.prorated.gb,PR4,'pro-rated allotment = 85 ÷ 30 × 7',1e-9);
near(ds.rtRows.find(r=>r.sim_no==='8991000000000000004').alloc_mb/1024,PR4,'real-time allocation of SIM 4 is pro-rated',1e-9);
eq([v1.alloc_gb,v1.prorated_days,v1.plan_gb],[85,null,85],'vehicle: full-cycle SIM keeps its 85 GB; Plan (GB) stays the plan size');
near(P.used_gb,88,'pool used = Σ pooled SIM usage',1e-6);
near(P.remaining_gb,P.capacity_gb-88,'pool available = allotted − used',1e-9);
near(ds.rtRows.filter(r=>r.pooled).reduce((a,r)=>a+r.avail_mb,0)/1024,P.remaining_gb,'Σ SIM-level available = pool available (real-time tab agrees with the Data Pool tab)',1e-6);
eq([P.monthly_cost,P.inventory_sims,P.eligible_sims,P.non_eligible_sims],[4*375,7,4,3],'pool cost 4 × ₹375; 7 SIMs in the SIM Group, 4 count, 3 do not');
eq([P.rec.type,P.rec.saving],['oversized',375],'32% used → the idle SIM can leave the pool');
ok(ds.simKeys.has('915700000000002')&&ds.simKeys.has('8991000000000000007'),'SIM keys include MSISDN and ICCID for ownership');

group('"as of" a day — usage from the 22nd; the pool holds the SIMs activated by then');
const dsA=bd({inventory,months:{'Sep 2026':m},fleet,asOf:'2026-08-23'});
const rA=id=>dsA.rtRows.find(r=>r.sim_no===id);
eq(dsA.asOf,'2026-08-23','as-of day applied');
near(rA('8991000000000000003').used_mb/1024,80,'SIM 3 used 40 + 40 GB by the end of 23 Aug',1e-6);
near(rA('8991000000000000002').used_mb/1024,0.75,'SIM 2: both circles summed (0.5 + 0.25 GB)',1e-6);
eq(rA('8991000000000000004').alloc_mb,0,'SIM 4 (activated 15 Sep) had no allocation on 23 Aug');
const PA=dsA.pool;
eq([PA.pooled_sims,PA.capacity_gb,PA.not_yet_active,PA.days_elapsed,PA.complete],[3,255,1,2,false],'pool on 23 Aug: 3 × 85 GB = 255 GB (SIM 4 joins on 15 Sep); day 2 of 31');
near(PA.used_gb,81.25,'pool used by the end of 23 Aug',1e-6);
near(PA.remaining_gb,255-81.25,'pool remaining at the end of 23 Aug',1e-6);
near(dsA.rtRows.filter(r=>r.pooled).reduce((a,r)=>a+r.avail_mb,0)/1024,PA.remaining_gb,'Σ SIM-level available = pool available on that day',1e-6);
eq(dsA.CD.vehicles.find(v=>v.reg==='GJ01AA0001').used_gb,1,'vehicle tabs keep the cycle total (1 GB), not the as-of day');
near(bd({inventory,months:{'Sep 2026':m},fleet,asOf:'2026-08-22'}).pool.used_gb,41.25,'reset: on the 22nd only that day\'s usage counts',1e-6);
const dsL=bd({inventory,months:{'Sep 2026':m},fleet,asOf:'2026-09-21'});
eq(dsL.asOf,null,'the last day with data = the cycle totals');
near(dsL.pool.capacity_gb,255+PR4,'…with the full pro-rated pool',1e-9);
eq(bd({inventory,months:{'Sep 2026':m},fleet,asOf:'2026-09-25'}).asOf,null,'a day outside the cycle on screen is ignored');
const DD=ds.pool.days;
